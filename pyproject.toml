[build-system]
requires = ["setuptools>=68"]
build-backend = "build_support.backend"
backend-path = ["."]

[project]
name = "workbench"
version = "0.1.0"
description = "Workbench for project-local OMP sessions, tasks and logs"
requires-python = ">=3.12"
dependencies = [
    "pyte==0.8.2",
    "wcwidth==0.8.4",
    "aiohttp==3.14.5",
    "aiohappyeyeballs==2.7.1",
    "aiosignal==1.4.0",
    "attrs==26.1.0",
    "frozenlist==1.8.0",
    "idna==3.20",
    "multidict==7.2.0",
    "propcache==0.5.4",
    "typing-extensions==4.16.0",
    "yarl==1.25.1",
]

[tool.setuptools]
package-dir = {"" = "src"}
script-files = ["build_support/entrypoints/wb", "build_support/entrypoints/omp-workbench"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"workbench.contracts" = ["*.json"]
"workbench.hub.web" = ["static/**/*"]

[tool.setuptools.cmdclass]
build_py = "build_support.assets.BuildPy"
