[build-system]
requires = ["setuptools>=68"]
build-backend = "build_support.backend"
backend-path = ["."]

[project]
name = "workbench"
version = "0.1.0"
description = "Workbench for project-local OMP sessions, tasks and logs"
requires-python = ">=3.12"
dependencies = ["pyte==0.8.2", "wcwidth==0.8.4"]

[tool.setuptools]
package-dir = {"" = "src"}
script-files = ["build_support/entrypoints/wb", "build_support/entrypoints/omp-workbench"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"workbench.contracts" = ["*.json"]

[tool.setuptools.cmdclass]
build_py = "build_support.assets.BuildPy"
